name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned, and installed via EarthBuild/actions-setup rather than piping
  # install.sh to a shell. That installer resolves "latest" through
  # *unauthenticated* api.github.com, which allows 60 requests/hour per IP —
  # a budget GitHub-hosted runners share across every job on the box — so it
  # died with an opaque 403 seconds into the run, at random, in whichever job
  # lost the race. That is what broke unit-tests while lint and integration
  # passed in the same run.
  #
  # The action fixes both halves: it authenticates with GITHUB_TOKEN (1000
  # req/hour) and, given an explicit version, needs no version lookup at all.
  # It also caches the binary between runs. This mirrors what crossplane-diff
  # does with earthly/actions-setup; note that action hardcodes
  # github.com/earthly/earthly, so the EarthBuild fork of it is the one that
  # can install this fork's releases.
  #
  # Renovate should own both this version and the action's pinned SHA; see
  # the renovate setup task.
  EARTHBUILD_VERSION: v0.8.18

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install earthbuild
        uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.EARTHBUILD_VERSION }}
      - run: earth +lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install earthbuild
        uses: EarthBuild/actions-setup@f4d20223e70dbb43b5fc08c4d857ab9cf0dbf3ae # v2.2.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.EARTHBUILD_VERSION }}
      - run: earth +test

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: go
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  trivy-scan-fs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          ignore-unfixed: true
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: sarif
          output: trivy-results.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # Live integration against unjira.atlassian.net, using the repo's existing
  # UNJIRA_CI_EMAIL variable and UNJIRA_CI_TOKEN secret (composed into
  # UNJIRA_JIRA_CREDENTIALS below). Required on every PR (unlike the
  # Python-era job, which was manual-dispatch-only) — GitHub Actions minutes
  # are free on public repos, so there's no cost reason to gate this behind
  # a manual trigger on a codebase this new.
  #
  # Gated by the "live-jira" environment (Settings > Environments), which
  # should have required reviewers configured: same-repo PRs run
  # immediately (the environment auto-approves for the repo owner), fork
  # PRs pause for a maintainer's approval before secrets are exposed to
  # them, since fork PRs don't get repo secrets by default on a public repo.
  integration:
    runs-on: ubuntu-latest
    environment: live-jira
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # UNJIRA_JIRA_CREDENTIALS is the single credential form the whole codebase
      # reads (see internal/credentials): a JSON object keyed by connection
      # name. It is composed here from the same UNJIRA_CI_EMAIL variable and
      # UNJIRA_CI_TOKEN secret this job has always used — no new repository
      # secrets are required.
      #
      # jq builds the JSON rather than a YAML string template, so a token
      # containing a quote, backslash, or other JSON metacharacter is escaped
      # correctly instead of producing a blob that fails to parse. The values
      # arrive as env vars and are read by jq via $ENV, so they are never
      # interpolated into the command line where they could be logged or
      # mangled by the shell.
      #
      # The "dev" key must match the connection name internal/live
      # authenticates as (its default; override with
      # UNJIRA_LIVE_JIRA_CONNECTION).
      - name: Compose Jira credentials
        env:
          CI_EMAIL: ${{ vars.UNJIRA_CI_EMAIL }}
          CI_TOKEN: ${{ secrets.UNJIRA_CI_TOKEN }}
        run: |
          printf 'UNJIRA_JIRA_CREDENTIALS=%s\n' \
            "$(jq -cn '{dev: {email: $ENV.CI_EMAIL, token: $ENV.CI_TOKEN}}')" >> "$GITHUB_ENV"
      - run: UNJIRA_LIVE=1 go test -tags=live ./internal/live/...
        env:
          UNJIRA_JIRA_SITE: https://unjira.atlassian.net
