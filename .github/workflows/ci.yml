name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned rather than resolved at install time. earthbuild's install.sh asks
  # api.github.com for the latest release *unauthenticated*, and that endpoint
  # allows only 60 requests/hour per IP — a limit GitHub-hosted runners share
  # across every job on the box. It fails with an opaque 403 seconds into the
  # run, at random, in whichever job loses the race; that is what broke
  # unit-tests while lint and integration passed in the same run.
  #
  # Downloading a known tag from releases/download/ skips the API entirely, so
  # there is no rate limit to lose. (crossplane-diff avoids the same trap via
  # earthly/actions-setup, which passes a token and takes a pinned version —
  # that action hardcodes github.com/earthly/earthly, so it cannot install
  # this fork.) Renovate should own this bump; see the renovate setup task.
  EARTHBUILD_VERSION: v0.8.18

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install earthbuild
        run: |
          curl -fsSL -o /usr/local/bin/earth \
            "https://github.com/EarthBuild/earthbuild/releases/download/${EARTHBUILD_VERSION}/earth-linux-amd64"
          chmod +x /usr/local/bin/earth
          earth --version
      - run: earth +lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install earthbuild
        run: |
          curl -fsSL -o /usr/local/bin/earth \
            "https://github.com/EarthBuild/earthbuild/releases/download/${EARTHBUILD_VERSION}/earth-linux-amd64"
          chmod +x /usr/local/bin/earth
          earth --version
      - run: earth +test

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: go
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  trivy-scan-fs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          ignore-unfixed: true
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: sarif
          output: trivy-results.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # Live integration against unjira.atlassian.net, using the repo's existing
  # UNJIRA_CI_EMAIL/UNJIRA_CI_TOKEN secrets. Required on every PR (unlike the
  # Python-era job, which was manual-dispatch-only) — GitHub Actions minutes
  # are free on public repos, so there's no cost reason to gate this behind
  # a manual trigger on a codebase this new.
  #
  # Gated by the "live-jira" environment (Settings > Environments), which
  # should have required reviewers configured: same-repo PRs run
  # immediately (the environment auto-approves for the repo owner), fork
  # PRs pause for a maintainer's approval before secrets are exposed to
  # them, since fork PRs don't get repo secrets by default on a public repo.
  integration:
    runs-on: ubuntu-latest
    environment: live-jira
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: UNJIRA_LIVE=1 go test -tags=live ./internal/live/...
        env:
          UNJIRA_JIRA_SITE: https://unjira.atlassian.net
          UNJIRA_JIRA_EMAIL: ${{ vars.UNJIRA_CI_EMAIL }}
          UNJIRA_JIRA_TOKEN: ${{ secrets.UNJIRA_CI_TOKEN }}
